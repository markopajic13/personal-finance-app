<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Finance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <img
          class="sidebar__logo"
          src="content/Sidebar/Sidebar/Logo.svg"
          alt="finance"
        />
        <nav class="sidebar__nav">
          <ul class="sidebar__list">
            <li>
              <a class="sidebar__link sidebar__link--active" href="#">
                <img
                  class="sidebar__icon"
                  src="content/Sidebar/Sidebar/Icons/home-active-icon.svg"
                  alt=""
                />
                <span class="sidebar__text">Overview</span>
              </a>
            </li>

            <li>
              <a class="sidebar__link" href="#">
                <img
                  class="sidebar__icon"
                  src="content/Sidebar/Sidebar/Icons/transactions-icon.svg"
                  alt=""
                />
                <span class="sidebar__text">Transactions</span>
              </a>
            </li>

            <li>
              <a class="sidebar__link" href="#">
                <img
                  class="sidebar__icon"
                  src="content/Sidebar/Sidebar/Icons/budgets-icon.svg"
                  alt=""
                />
                <span class="sidebar__text">Budgets</span>
              </a>
            </li>

            <li>
              <a class="sidebar__link" href="#">
                <img
                  class="sidebar__icon"
                  src="content/Sidebar/Sidebar/Icons/pots-icon.svg"
                  alt=""
                />
                <span class="sidebar__text">Pots</span>
              </a>
            </li>

            <li>
              <a class="sidebar__link" href="#">
                <img
                  class="sidebar__icon"
                  src="content/Sidebar/Sidebar/Icons/recurring-bills-icon.svg"
                  alt=""
                />
                <span class="sidebar__text"> Reccurring Bills</span>
              </a>
            </li>
          </ul>
        </nav>
        <button class="sidebar__toggle" type="button">
          <img
            class="sidebar__icon"
            src="content/Sidebar/Sidebar/Icons/minimize-menu-icon.svg"
            alt=""
          />
          <span class="sidebar__text">Minimize Menu</span>
        </button>
      </aside>
      <main class="main">
        <h1 class="main__title">Overview</h1>
        <article class="summary-card summary-card--dark">
          <span class="summary-card__label">Current Balance</span>
          <span class="summary-card__amount">$4,836.00</span>
        </article>

        <article class="summary-card">
          <span class="summary-card__label">Income</span>
          <span class="summary-card__amount">$3,814.25</span>
        </article>

        <article class="summary-card">
          <span class="summary-card__label">Expenses</span>
          <span class="summary-card__amount">$1,700.50</span>
        </article>

        <section class="pots">
          <div class="pots__header">
            <h2 class="pots__title">Pots</h2>
            <a class="pots__link" href="#">
              See Details
              <img
                class="pots__arrow"
                src="content/Button/ph_caret-down-fill.png"
                alt=""
              />
            </a>
          </div>
          <div class="pots__content">
            <div class="pots__total">
              <img
                class="pots__icon"
                src="content/ph_tip-jar-light.svg"
                alt=""
              />
              <div>
                <p class="pots__total-label">Total Saved</p>
                <p class="pots__total-amount">$850</p>
              </div>
            </div>

            <ul class="pots__list">
              <li class="pots__item pots__item--green">
                <span class="pots__name">Savings</span>
                <span class="pots__amount">$159</span>
              </li>
              <li class="pots__item pots__item--cyan">
                <span class="pots__name">Gift</span>
                <span class="pots__amount">$40</span>
              </li>
              <li class="pots__item pots__item--navy">
                <span class="pots__name">Concert Ticket</span>
                <span class="pots__amount">$110</span>
              </li>
              <li class="pots__item pots__item--yellow">
                <span class="pots__name">New Laptop</span>
                <span class="pots__amount">$10</span>
              </li>
            </ul>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
